name: Tests

# Additive CI — runs the offline test suite. Does NOT touch the Azure deploy
# workflow (main_amenify-support-bot.yml) and needs no secrets.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies (runtime + dev group)
        run: uv sync --group dev

      - name: Run offline test suite
        run: uv run pytest -m "not live" -q --cov=Backend --cov-report=term-missing
