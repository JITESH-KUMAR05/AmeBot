[project]
name = "amebot"
version = "1.0.0"
description = "AmeBot — Amenify customer support RAG bot (dev/test tooling; deploy uses Backend/requirements.txt)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pydantic>=2.7",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["Backend"]
testpaths = ["Backend/tests"]
markers = [
    "live: hits real Azure OpenAI; skipped unless AZURE_OPENAI_* env vars are set",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv]
# This project ships a fully-pinned Backend/requirements.txt for Azure Oryx.
# pyproject.toml + uv.lock are for LOCAL dev/test only. Keep them roughly in sync.
